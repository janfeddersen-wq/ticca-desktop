[package]
name = "ticca-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GPUI-based frontend for Ticca Desktop"

[[bin]]
name = "ticca"
path = "src/main.rs"

[dependencies]
# UI Framework
gpui.workspace = true

# Async Runtime
tokio.workspace = true

# Error Handling
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Date/Time
chrono.workspace = true

# Markdown parsing
pulldown-cmark = "0.12"

# Syntax highlighting
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }

# UUID generation
uuid = { version = "1.10", features = ["v4"] }

# Internal Crates
ticca-core.workspace = true
ticca-config.workspace = true
ticca-db.workspace = true
ticca-bridge.workspace = true
