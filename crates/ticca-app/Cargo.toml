[package]
name = "ticca-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "ticca"
path = "src/main.rs"

[dependencies]
ticca-core.workspace = true
ticca-oauth.workspace = true


gpui.workspace = true
gpui-component = { workspace = true, features = ["tree-sitter-languages"] }
gpui-component-assets.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pulldown-cmark.workspace = true
syntect.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
async-stream = "0.3"
futures.workspace = true
rfd.workspace = true

# Emoji rendering via Twemoji SVG
twemoji-assets = { version = "1.5", features = ["svg"] }
unicode-segmentation = "1.12"

# Clipboard support (with image feature for screenshots)
# wayland-data-control enables native Wayland clipboard via wlr-data-control protocol
arboard = { version = "3", features = ["image", "wayland-data-control"] }

# Image processing
image.workspace = true

# SVG rasterization for window icons
resvg = "0.45"

# Base64 encoding for image data
base64.workspace = true

# Regex for math preprocessing
regex = "1"

# Open URLs in browser
open.workspace = true

# HTTP types for custom headers
http = "1"

# Platform-specific data directories
directories.workspace = true

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# TUI/CLI framework
ratatui = "0.29"
crossterm = "0.28"
ctrlc = "3.4"

# Streaming markdown rendering
streamdown-parser = { path = "/home/jan/sources/streamdown-rs/crates/streamdown-parser" }
streamdown-render = { path = "/home/jan/sources/streamdown-rs/crates/streamdown-render" }
streamdown-config = { path = "/home/jan/sources/streamdown-rs/crates/streamdown-config" }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = "0.45"
