[workspace]
resolver = "2"
members = [
    "crates/ticca-app",
    "crates/ticca-core",
    "crates/ticca-oauth",
]

[workspace.package]
version = "0.25.1"
edition = "2024"
authors = ["Jan Feddersen"]
license = "MIT"
repository = "https://github.com/jan/ticca-desktop"
description = "A sleek, GPUI-based desktop application for AI-assisted coding"
keywords = ["ai", "coding", "assistant", "gpui", "desktop"]
categories = ["development-tools", "gui"]
readme = "README.md"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "stream"] }
bytes = "1.7"

# GUI - GPUI from Zed
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { path = "/home/jan/sources/gpui-component/crates/ui" }
gpui-component-assets = { path = "/home/jan/sources/gpui-component/crates/assets" }

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# LLM Framework - serdesAI (local development paths)
serdes-ai = { path = "/home/jan/sources/serdesAI/serdes-ai" }
serdes-ai-core = { path = "/home/jan/sources/serdesAI/serdes-ai-core" }
serdes-ai-agent = { path = "/home/jan/sources/serdesAI/serdes-ai-agent" }
serdes-ai-models = { path = "/home/jan/sources/serdesAI/serdes-ai-models", features = ["claude-code-oauth", "chatgpt-oauth", "anthropic", "openai"] }
serdes-ai-tools = { path = "/home/jan/sources/serdesAI/serdes-ai-tools" }
serdes-ai-toolsets = { path = "/home/jan/sources/serdesAI/serdes-ai-toolsets" }
serdes-ai-streaming = { path = "/home/jan/sources/serdesAI/serdes-ai-streaming" }
serdes-ai-mcp = { path = "/home/jan/sources/serdesAI/serdes-ai-mcp" }

# MCP (Model Context Protocol)
rmcp = { version = "0.12", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }

# Markdown & syntax highlighting
pulldown-cmark = "0.11"
syntect = "5.2"

# ripgrep libraries
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"

# Async utilities
futures = "0.3"

# File dialogs
rfd = "0.15"

# Utilities
directories = "5.0"
open = "5.3"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2.5"
semver = "1.0"

# Internal crates
ticca-core = { path = "crates/ticca-core" }
ticca-oauth = { path = "crates/ticca-oauth" }


[profile.release]
lto = true
codegen-units = 1
strip = true
