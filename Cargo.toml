[workspace]
members = [
    "crates/ticca-ui",
    "crates/ticca-core",
    "crates/ticca-bridge",
    "crates/ticca-db",
    "crates/ticca-config"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ticca Team"]
license = "MIT"
repository = "https://github.com/ticca/ticca-desktop"
rust-version = "1.75"

[workspace.dependencies]
# Async Runtime
tokio = { version = "1.40", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async traits
async-trait = "0.1"

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UI Framework (GPU-accelerated, 120FPS target)
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }

# Python Bridge
pyo3 = { version = "0.22", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.22", features = ["tokio-runtime"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
chrono = { version = "0.4", features = ["serde"] }

# Configuration
directories = "5.0"

# Testing
tempfile = "3.10"

# Internal Crates
ticca-core = { path = "crates/ticca-core" }
ticca-bridge = { path = "crates/ticca-bridge" }
ticca-db = { path = "crates/ticca-db" }
ticca-config = { path = "crates/ticca-config" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
