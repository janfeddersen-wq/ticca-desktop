[package]
name = "ticca-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "ticca"
path = "src/main.rs"

[dependencies]
ticca-core.workspace = true
ticca-oauth.workspace = true

# LLM Framework
rig.workspace = true

iced.workspace = true
iced_fonts.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pulldown-cmark.workspace = true
syntect.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
async-stream = "0.3"
futures.workspace = true
rfd.workspace = true

# Emoji rendering via Twemoji SVG
twemoji-assets = { version = "1.5", features = ["svg"] }
unicode-segmentation = "1.12"

# Clipboard support (with image feature for screenshots)
# wayland-data-control enables native Wayland clipboard via wlr-data-control protocol
arboard = { version = "3", features = ["image", "wayland-data-control"] }

# Material Icons font and codepoints
material-icons.workspace = true

# Image processing
image.workspace = true

# Base64 encoding for image data
base64.workspace = true

# Regex for math preprocessing
regex = "1"

# Open URLs in browser
open.workspace = true
