# Release workflow for Ticca Desktop
#
# This workflow builds release artifacts for all platforms when a new
# version tag is pushed. It creates:
# - macOS: Universal binary (.app bundle) for x64 and ARM64
# - Linux: x64 AppImage and tarball
# - Windows: x64 installer and portable executable
#
# The Python interpreter is bundled using PyOxidizer, so users don't
# need to install Python separately.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================================
  # Create Release Draft
  # ============================================================================
  
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Ticca Desktop ${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}
          generate_release_notes: true

  # ============================================================================
  # Build Platform Binaries
  # ============================================================================
  
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS x64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macOS-x64
            artifact: ticca-desktop-macos-x64
            ext: ""
          
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macOS-ARM64
            artifact: ticca-desktop-macos-arm64
            ext: ""
          
          # Linux x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: Linux-x64
            artifact: ticca-desktop-linux-x64
            ext: ""
          
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
            artifact: ticca-desktop-windows-x64
            ext: ".exe"
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-
      
      - name: Install PyOxidizer
        run: pip install pyoxidizer
      
      - name: Build Rust binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          TICCA_BUNDLE_PYTHON: "1"
      
      - name: Bundle Python (PyOxidizer)
        run: pyoxidizer build --target-triple ${{ matrix.target }} exe
        continue-on-error: true  # PyOxidizer may not work for all targets
      
      - name: Create distribution directory
        shell: bash
        run: mkdir -p dist
      
      # macOS: Create .app bundle
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p "Ticca.app/Contents/MacOS"
          mkdir -p "Ticca.app/Contents/Resources"
          
          # Copy binary
          cp "target/${{ matrix.target }}/release/ticca-ui" "Ticca.app/Contents/MacOS/Ticca"
          
          # Create Info.plist
          cat > "Ticca.app/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>Ticca</string>
            <key>CFBundleIdentifier</key>
            <string>io.ticca.desktop</string>
            <key>CFBundleName</key>
            <string>Ticca</string>
            <key>CFBundleDisplayName</key>
            <string>Ticca Desktop</string>
            <key>CFBundleVersion</key>
            <string>${{ needs.create-release.outputs.version }}</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ needs.create-release.outputs.version }}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSSupportsAutomaticGraphicsSwitching</key>
            <true/>
          </dict>
          </plist>
          EOF
          
          # Create zip archive
          cd Ticca.app/..
          zip -r "../dist/${{ matrix.artifact }}.zip" Ticca.app
      
      # Linux: Create tarball
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p "dist/ticca-desktop"
          cp "target/${{ matrix.target }}/release/ticca-ui" "dist/ticca-desktop/ticca"
          cp README.md LICENSE* "dist/ticca-desktop/" 2>/dev/null || true
          
          cd dist
          tar -czvf "${{ matrix.artifact }}.tar.gz" ticca-desktop
          rm -rf ticca-desktop
      
      # Windows: Create zip
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/ticca-desktop
          Copy-Item "target/${{ matrix.target }}/release/ticca-ui.exe" "dist/ticca-desktop/ticca.exe"
          Copy-Item README.md, LICENSE* "dist/ticca-desktop/" -ErrorAction SilentlyContinue
          
          Compress-Archive -Path dist/ticca-desktop -DestinationPath "dist/${{ matrix.artifact }}.zip"
          Remove-Item -Recurse dist/ticca-desktop
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # ============================================================================
  # Upload Release Assets
  # ============================================================================
  
  upload-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [create-release, build]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: List artifacts
        run: find artifacts -type f
      
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: artifacts/**/*
          fail_on_unmatched_files: false

  # ============================================================================
  # Publish Release (after all assets uploaded)
  # ============================================================================
  
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [create-release, upload-assets]
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          draft: false
