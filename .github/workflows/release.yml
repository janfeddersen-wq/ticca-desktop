name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: ticca-desktop

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            artifact: ticca
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            artifact: ticca.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            artifact: ticca
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            artifact: ticca

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ticca-desktop/target
          key: ${{ matrix.target }}-cargo-release-${{ hashFiles('ticca-desktop/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-release-

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../../ticca-${{ matrix.name }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../../ticca-${{ matrix.name }}.zip ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticca-${{ matrix.name }}
          path: |
            ticca-${{ matrix.name }}.tar.gz
            ticca-${{ matrix.name }}.zip
          if-no-files-found: ignore

  create-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts
        working-directory: .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ticca-linux-x86_64/ticca-linux-x86_64.tar.gz
            artifacts/ticca-windows-x86_64/ticca-windows-x86_64.zip
            artifacts/ticca-macos-x86_64/ticca-macos-x86_64.tar.gz
            artifacts/ticca-macos-aarch64/ticca-macos-aarch64.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
